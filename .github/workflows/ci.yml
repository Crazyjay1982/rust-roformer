name: build

on:
  push:
  pull_request:

# v7, not v4: the runner moved off Node 20 and checkout@v4 still declares it, which
# makes every job print a deprecation warning beside an otherwise clean run. All four
# usages take no inputs, so the one breaking change on this line (the safer
# `pull_request_target` defaults that landed in v5/v6/v7 together) does not reach us —
# this workflow triggers on `pull_request`, where the token is already read-only.

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # Deny only on warnings the diff introduces would be nicer, but this crate
      # starts clean, so the bar is simply "clean".
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings

  # `rust-version` in Cargo.toml is an intent until a machine checks it, and the
  # check has to cover both feature sets: this job is what keeps the badge in the
  # README from being decoration.
  #
  # Why 1.88 and not the 1.75 this crate originally claimed: `ort` and `ort-sys`
  # rc.13 declare a 1.88 floor, so `cargo +1.85 check` is refused before anything
  # compiles; and the library itself now calls `usize::is_multiple_of` (1.87+), so
  # there is no older toolchain left to test even with the engine switched off.
  # Both were measured, not read off a changelog.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo +1.88 check --all-targets
      - run: cargo +1.88 check --no-default-features --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No model weights and no audio exist in this repository, so the default
      # feature set is exercised without any inference: the weight-requiring arms
      # skip themselves. Keep that property — a test that needs a 953 MB file
      # downloaded from Hugging Face does not belong in this job.
      - run: cargo test --no-default-features
      - run: cargo test

  # The MLX engine needs a local MLX build; it is compiled and exercised on
  # Apple Silicon runners only when one is available, and its absence here is
  # stated rather than hidden.
  mlx-apple-silicon:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features --features mlx
